name: smart_pos_app
description: "Smart POS application with Barcode scanner and ESC/POS thermal printing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^5.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
