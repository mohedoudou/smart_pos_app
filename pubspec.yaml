name: smart_pos_app
description: "Smart POS application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # مكتبات مسح الباركود
  mobile_scanner: ^5.1.1
  
  # قاعدة البيانات المحلية
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # طباعة وتوليد الفواتير والرموز
  print_bluetooth_thermal: ^1.1.0
  esc_pos_utils_plus: ^2.0.1
  image: ^4.1.7
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
